  <meta name="description" content="하루 계획을 짜주고, 배운 것을 다시 볼 때가 되면 그 계획에 넣어줍니다. 다시 읽는 대신 안 보고 떠올리게 합니다. API 키 없이도 전부 동작합니다.">
  <meta property="og:title" content="LearnFast — 공부 계획과 복습이 한 바퀴">
  <meta property="og:description" content="계획은 앱이 짜고, 틀린 것만 다시 띄웁니다. 무거운 건 여러분이 쓰는 AI 챗앱이 하고, 이 앱은 기억만 합니다.">

<body>
<!--
  LearnFast — 공부 계획과 복습이 한 바퀴 도는 앱.

  설계 원칙
   1. 결정을 사용자에게 되돌려주지 않는다. 빈 입력창을 만들지 않고, 기본값을 정해둔다.
   2. 앱은 사용자를 평가하지 않는다. 칭찬도 위로도 잔소리도 하지 않고 사실만 적는다.
   3. 하지 않은 것을 한 것처럼 세지 않는다.
   4. AI 실패는 상시 조건이다. 키가 없거나 한도를 넘겨도 모든 기능이 돈다.

  스택: 바닐라 JS + HTML + CSS. 빌드도구·프레임워크·의존성 0. 저장은 localStorage 뿐.
  서버가 없고, 어떤 데이터도 밖으로 나가지 않는다.
-->
  <main id="screen"></main>
  <script src="app.js"></script>
</body>
