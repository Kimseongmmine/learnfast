# client/ 폴더를 GitHub Pages 에 올린다.
#
# 왜 이 파일이 필요한가:
# Pages 는 원래 "저장소 루트" 또는 "docs 폴더" 둘 중 하나만 서빙한다. client/ 는 못 고른다.
# 그래서 사람이 하던 일(폴더를 통째로 Pages 에 올리기)을 이 워크플로가 대신한다.
#
# 앱에 빌드 도구가 생긴 건 아니다. 여기서 하는 일은 "client 폴더를 그대로 복사해서 올리기" 뿐이고,
# 코드를 변환하거나 합치지 않는다. 클라이언트는 여전히 의존성 0 이다.

name: Deploy client to Pages

on:
  # main 에 밀 때마다
  push:
    branches: [main]
  # Actions 탭에서 손으로도 돌릴 수 있게
  workflow_dispatch:

# 이 워크플로에 주는 권한. 필요한 것만 준다.
permissions:
  contents: read      # 저장소 읽기
  pages: write        # Pages 에 쓰기
  id-token: write     # Pages 에 "이 워크플로가 맞다" 를 증명하는 토큰

# 배포가 겹치지 않게 한 번에 하나만. 앞선 것을 죽이지는 않는다 -
# 배포 도중에 끊기면 사이트가 어중간한 상태로 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. 테스트부터 ────────────────────────────────────────────
  # 깨진 앱이 배포되지 않게 막는 관문이다. 로컬에서 돌리는 것과 똑같은 명령이고,
  # 네트워크도 실제 시각도 안 써서 CI 에서도 결과가 흔들리지 않는다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/run.js

  # ── 2. 통과했을 때만 배포 ────────────────────────────────────
  deploy:
    needs: test        # ← 이 한 줄이 "테스트가 통과해야 배포된다" 를 만든다
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client          # ← 올릴 폴더. 여기만 바뀌면 다른 폴더도 올릴 수 있다
      - id: deployment
        uses: actions/deploy-pages@v4
